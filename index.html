
<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0715">
<title>AARO AI</title>

<style>
:root {
  --bg: #0b0715;
  --panel: #171126;
  --purple: #a66bff;
  --text: #f7f1ff;
  --muted: #b9accd;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, "Noto Sans Sinhala", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
header {
  padding: 17px 20px;
  border-bottom: 1px solid #302144;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.logo { font-size: 23px; font-weight: bold; }
.logo span { color: var(--purple); }
.status { color: #b7f5d0; font-size: 12px; }

main {
  max-width: 800px;
  margin: auto;
  padding: 22px 15px;
}
.hero { text-align: center; padding: 12px 0 20px; }
.orb {
  width: 100px;
  height: 100px;
  margin: auto auto 14px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #e0c4ff, #9a4bff 40%, #31105d 75%);
  box-shadow: 0 0 35px #8d45ff66;
  display: grid;
  place-items: center;
  font-size: 42px;
}
h1 { margin: 8px 0; font-size: 29px; }
.hero p { color: var(--muted); line-height: 1.7; }

.settings {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 15px;
}
select, button, input {
  font: inherit;
}
select {
  background: var(--panel);
  color: white;
  border: 1px solid #44315e;
  padding: 11px;
  border-radius: 10px;
  min-width: 0;
  max-width: 100%;
}
.chat {
  background: var(--panel);
  border: 1px solid #302144;
  border-radius: 18px;
  padding: 15px;
}
.messages {
  height: 300px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 13px;
  padding-bottom: 14px;
}
.msg {
  max-width: 88%;
  padding: 12px 14px;
  border-radius: 15px;
  line-height: 1.6;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}
.bot {
  align-self: flex-start;
  background: #29203b;
}
.user {
  align-self: flex-end;
  background: #6332a3;
}
.msg small {
  display: block;
  margin-top: 7px;
  color: #ded0f4;
  font-size: 11px;
}
.composer {
  display: flex;
  gap: 8px;
  border-top: 1px solid #382849;
  padding-top: 14px;
}
input {
  width: 100%;
  min-width: 0;
  color: white;
  background: #0e0a19;
  border: 1px solid #45325c;
  border-radius: 12px;
  padding: 13px;
  outline: none;
}
input:focus { border-color: var(--purple); }
button {
  border: 0;
  border-radius: 12px;
  padding: 12px 15px;
  cursor: pointer;
  color: white;
  background: #6332a3;
}
button:active { transform: scale(.97); }
.primary { background: var(--purple); color: #160925; font-weight: bold; }
.mode-row {
  display: flex;
  gap: 10px;
  margin: 0 0 14px;
}
.mode-btn {
  flex: 1;
  background: #171126;
  border: 1px solid #44315e;
}
.mode-btn.active {
  background: var(--purple);
  color: #160925;
  font-weight: bold;
  border-color: var(--purple);
}
.voice-row {
  display: flex;
  gap: 9px;
  margin-top: 12px;
}
.voice-row button { flex: 1; }
#micBtn.listening {
  background: #c04470;
  animation: pulse 1s infinite alternate;
}
@keyframes pulse {
  from { box-shadow: 0 0 0 0 #ff5caa22; }
  to { box-shadow: 0 0 0 7px #ff5caa33; }
}
.note {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
  margin: 15px 3px;
}
footer { text-align: center; padding: 15px; color: #8f80a6; font-size: 12px; }

@media(max-width: 480px) {
  header { padding: 14px; }
  .logo { font-size: 20px; }
  main { padding: 15px 10px; }
  .composer { flex-wrap: wrap; }
  .composer input { flex: 1 1 65%; }
  .composer button { flex: 1; }
  .messages { height: 42vh; min-height: 230px; }
}
</style>
</head>

<body>
<header>
  <div class="logo">✦ <span>AARO</span> AI</div>
  <div class="status">● Ready</div>
</header>

<main>
  <section class="hero">
    <div class="orb">✦</div>
    <h1>Hi, මම AARO!</h1>
    <p>ඔයාගේම AI Assistant 🤖<br>
    අපි සිංහලෙන් කතා කරමු.</p>
  </section>

  <section class="mode-row" aria-label="AARO AI mode">
    <button id="chatModeBtn" type="button" class="mode-btn active" onclick="setMode('chat')">💬 Chat Mode</button>
    <button id="voiceModeBtn" type="button" class="mode-btn" onclick="setMode('voice')">🎙️ Voice Mode</button>
  </section>

  <section class="settings">
    <select id="language" aria-label="Voice recognition language">
      <option value="si-LK">සිංහල</option>
      <option value="en-US">English</option>
    </select>

    <select id="voiceSelect" aria-label="Assistant voice">
      <option value="">Default voice</option>
    </select>

    <select id="speed" aria-label="Voice speed">
      <option value="0.85">Slow voice</option>
      <option value="1">Normal voice</option>
      <option value="1.15" selected>Fast voice</option>
      <option value="1.25">Extra fast voice</option>
    </select>
  </section>

  <section class="chat">
    <div class="messages" id="messages" aria-live="polite">
      <div class="msg bot">
        හෙලෝ! 👋 මම AARO. ඔයාට මගෙන් මොනවද දැනගන්න ඕනේ?
        <small>AARO AI</small>
      </div>
    </div>

    <form class="composer" id="chatForm">
      <input id="userInput" autocomplete="off"
        placeholder="මෙතන සිංහලෙන් ටයිප් කරන්න..."
        aria-label="Message">
      <button class="primary" type="submit">Send ➤</button>
    </form>

    <div class="voice-row">
      <button id="micBtn" type="button">🎙️ කතා කරන්න</button>
      <button id="testVoiceBtn" type="button">🔊 හඬ පරීක්ෂා කරන්න</button>
      <button id="stopBtn" type="button">🔇 හඬ නවත්වන්න</button>
      <button id="clearMemoryBtn" type="button">🗑️ Chat memory මකන්න</button>
    </div>
  </section>

  <p class="note" id="info">
    Voice භාවිතයට microphone අවසරය දෙන්න.
    සැබෑ AI සේවාවට සම්බන්ධ වීමට සූදානම්. පණිවිඩයක් යවා පරීක්ෂා කරන්න.
  </p>
</main>

<footer>AARO AI · Your Personal Assistant</footer>

<script>
const messages = document.getElementById("messages");
const input = document.getElementById("userInput");
const form = document.getElementById("chatForm");
const micBtn = document.getElementById("micBtn");
const testVoiceBtn = document.getElementById("testVoiceBtn");
const stopBtn = document.getElementById("stopBtn");
const language = document.getElementById("language");
const voiceSelect = document.getElementById("voiceSelect");
const speed = document.getElementById("speed");
const info = document.getElementById("info");
const clearMemoryBtn = document.getElementById("clearMemoryBtn");
const chatModeBtn = document.getElementById("chatModeBtn");
const voiceModeBtn = document.getElementById("voiceModeBtn");
let currentMode = "chat";

function setMode(mode) {
  currentMode = mode;
  chatModeBtn.classList.toggle("active", mode === "chat");
  voiceModeBtn.classList.toggle("active", mode === "voice");
  // Chat mode is strictly text-only; voice mode is strictly voice-only.
  micBtn.disabled = mode !== "voice";
  micBtn.style.opacity = mode === "voice" ? "1" : "0.55";
  voiceSelect.disabled = mode !== "voice";
  speed.disabled = mode !== "voice";
  form.style.display = mode === "chat" ? "flex" : "none";
  micBtn.style.display = mode === "voice" ? "block" : "none";
  if (mode === "chat") {
    if (recognition && listening) {
      keepListening = false;
      try { recognition.stop(); } catch (_) {}
    }
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    info.textContent = "Chat Mode සක්‍රීයයි. Text වලින් පමණක් කතා කරන්න.";
  } else {
    info.textContent = "Voice Mode සක්‍රීයයි. Mic බොත්තම ඔබලා කතා කරන්න.";
  }
}
// Expose mode switching for the buttons as an additional reliable click path.
window.setMode = setMode;

let recognition = null;
let listening = false;
let selectedVoice = null;
const AARO_WORKER_URL = "https://aaro-ai-brain.nproshan1978.workers.dev";

// Privacy-friendly memory: saved only in this browser on this device.
// It is not uploaded as a separate memory database. The last 10 exchanges are kept.
const MEMORY_KEY = "aaro_ai_conversation_memory_v1";
const MAX_SAVED_MESSAGES = 20;
let conversationHistory = loadConversationMemory(); // Chat Mode history only
let voiceConversationHistory = [];
let isReplying = false;

function loadConversationMemory() {
  try {
    const saved = JSON.parse(localStorage.getItem(MEMORY_KEY) || "[]");
    if (!Array.isArray(saved)) return [];
    return saved
      .filter(item =>
        item &&
        (item.role === "user" || item.role === "model") &&
        typeof item.text === "string"
      )
      .slice(-MAX_SAVED_MESSAGES);
  } catch (error) {
    return [];
  }
}

function saveConversationMemory() {
  try {
    localStorage.setItem(
      MEMORY_KEY,
      JSON.stringify(conversationHistory.slice(-MAX_SAVED_MESSAGES))
    );
    return true;
  } catch (error) {
    info.textContent = "මේ browser එකේ memory save කරන්න බැහැ. Browser storage settings පරීක්ෂා කරන්න.";
    return false;
  }
}

function showWelcomeMessage() {
  messages.replaceChildren();
  if (conversationHistory.length) {
    conversationHistory.forEach(item => {
      addMessage(item.text, item.role === "user" ? "user" : "bot");
    });
    info.textContent = "පෙර chat එක මේ device එකෙන් නැවත ලබාගත්තා. Memory මකන්න button එකෙන් මකන්න පුළුවන්.";
  } else {
    addMessage("හෙලෝ! 👋 මම AARO. ඔයාට මගෙන් මොනවද දැනගන්න ඕනේ?", "bot");
  }
}

function addMessage(text, who) {
  const bubble = document.createElement("div");
  bubble.className = "msg " + who;
  bubble.appendChild(document.createTextNode(text));

  const label = document.createElement("small");
  label.textContent = who === "bot" ? "AARO AI" : "ඔයා";
  bubble.appendChild(label);

  messages.appendChild(bubble);
  messages.scrollTop = messages.scrollHeight;
}

function loadVoices() {
  if (!("speechSynthesis" in window)) return;

  const voices = window.speechSynthesis.getVoices();
  const oldValue = voiceSelect.value;

  voiceSelect.replaceChildren();
  const defaultOption = document.createElement("option");
  defaultOption.value = "";
  defaultOption.textContent = "Default voice";
  voiceSelect.appendChild(defaultOption);

  voices.forEach((voice, index) => {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = voice.name + " (" + voice.lang + ")";
    voiceSelect.appendChild(option);
  });

  if (oldValue !== "") voiceSelect.value = oldValue;
  if (!voiceSelect.value) selectedVoice = null;
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

voiceSelect.addEventListener("change", () => {
  const voices = window.speechSynthesis?.getVoices() || [];
  selectedVoice = voiceSelect.value === ""
    ? null
    : voices[Number(voiceSelect.value)] || null;
});

let currentAudio = null;
let speechRequestId = 0;

// Gemini TTS commonly returns raw PCM (audio/L16), which HTMLAudioElement
// cannot play directly. Convert 16-bit mono PCM into a standard WAV container.
function makePlayableAudioBlob(base64Audio, mimeType) {
  const binary = atob(base64Audio);
  const pcm = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) pcm[i] = binary.charCodeAt(i);

  const mime = String(mimeType || "").toLowerCase();
  const pcmFormat = mime.includes("l16") || mime.includes("pcm") || mime.includes("raw");
  if (!pcmFormat) {
    return new Blob([pcm], { type: mimeType || "audio/wav" });
  }

  const rateMatch = mime.match(/rate=(\\d+)/) || mime.match(/sample.?rate=(\\d+)/);
  const sampleRate = rateMatch ? Number(rateMatch[1]) : 24000;
  const channelsMatch = mime.match(/channels?=(\\d+)/);
  const channels = channelsMatch ? Number(channelsMatch[1]) : 1;
  const bytesPerSample = 2;
  const dataLength = pcm.byteLength;
  const wav = new ArrayBuffer(44 + dataLength);
  const view = new DataView(wav);
  const writeText = (offset, value) => {
    for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
  };
  writeText(0, "RIFF");
  view.setUint32(4, 36 + dataLength, true);
  writeText(8, "WAVE");
  writeText(12, "fmt ");
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, channels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * channels * bytesPerSample, true);
  view.setUint16(32, channels * bytesPerSample, true);
  view.setUint16(34, bytesPerSample * 8, true);
  writeText(36, "data");
  view.setUint32(40, dataLength, true);
  new Uint8Array(wav, 44).set(pcm);
  return new Blob([wav], { type: "audio/wav" });
}

function speak(text) {
  const requestId = ++speechRequestId;

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }

  if (!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined") {
    info.textContent = "මෙම browser එකේ හඬින් පිළිතුරු දීම සඳහා සහාය නැහැ. අලුත් Chrome හෝ Edge භාවිතා කරන්න.";
    return;
  }

  const synth = window.speechSynthesis;
  synth.cancel();

  const selectedLanguage = language.value || "si-LK";
  const isSinhala = selectedLanguage.toLowerCase().startsWith("si");
  const languageCode = selectedLanguage.toLowerCase().split("-")[0];
  const voices = synth.getVoices();

  // Use a matching language voice when available. Otherwise let the browser
  // choose its default voice rather than assigning a missing/invalid voice.
  const matchingVoice = selectedVoice &&
    (!isSinhala || selectedVoice.lang.toLowerCase().startsWith("si"))
      ? selectedVoice
      : voices.find(voice =>
          voice.lang.toLowerCase().startsWith(languageCode)
        ) || null;

  const spokenText = String(text || "").replace(/\\bAARO\\b/gi, "ආරෝ").trim();
  if (!spokenText) {
    info.textContent = "AI වෙතින් හිස් පිළිතුරක් ලැබුණා. නැවත උත්සාහ කරන්න.";
    return;
  }

  const utterance = new SpeechSynthesisUtterance(spokenText);
  utterance.lang = selectedLanguage;
  if (matchingVoice) utterance.voice = matchingVoice;
  utterance.rate = Number(speed.value) || 1;
  utterance.pitch = 1;

  let started = false;
  utterance.onstart = () => {
    started = true;
    if (requestId === speechRequestId) {
      info.textContent = isSinhala
        ? (matchingVoice
            ? "AARO AI සිංහල හඬින් පිළිතුරු දෙනවා..."
            : "සිංහල voice එකක් browser එකේ හමු වුණේ නැහැ. Default voice එකෙන් උත්සාහ කරනවා...")
        : "AARO AI හඬින් පිළිතුරු දෙනවා...";
    }
  };

  utterance.onend = () => {
    if (requestId === speechRequestId) {
      info.textContent = "AARO AI සම්බන්ධයි. තව ප්‍රශ්නයක් අහන්න.";
    }
  };

  utterance.onerror = (event) => {
    if (requestId !== speechRequestId || event.error === "canceled" || event.error === "interrupted") return;
    console.error("AARO browser speech failed:", event.error);
    info.textContent = "Browser හඬ දෝෂය: " + event.error +
      (isSinhala ? ". Chrome/Windows තුළ Sinhala voice එකක් තිබේදැයි පරීක්ෂා කරන්න." : ". වෙනත් voice එකක් තෝරා බලන්න.");
  };

  info.textContent = "හඬ සකස් කරමින්...";
  synth.resume();
  synth.speak(utterance);

  // If speech never starts, show a useful diagnostic instead of silently waiting.
  window.setTimeout(() => {
    if (requestId === speechRequestId && !started && synth.speaking === false) {
      info.textContent = isSinhala
        ? "හඬ ආරම්භ වුණේ නැහැ. 'හඬ පරීක්ෂා කරන්න' ඔබා බලන්න; Windows/Chrome voice settings පරීක්ෂා කරන්න."
        : "හඬ ආරම්භ වුණේ නැහැ. 'හඬ පරීක්ෂා කරන්න' ඔබා වෙනත් voice එකක් පරීක්ෂා කරන්න.";
    }
  }, 2500);
}

async function speakAnswer(text) {
  const spokenText = String(text || "").trim();
  if (!spokenText) {
    info.textContent = "AI වෙතින් හිස් පිළිතුරක් ලැබුණා.";
    return;
  }

  // Try generated audio first; if the TTS quota/service is unavailable, use browser speech.
  try {
    info.textContent = "AI පිළිතුර හඬට පරිවර්තනය කරමින්...";
    const response = await fetch(AARO_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        type: "tts",
        text: spokenText,
        language: language.value || "si-LK"
      })
    });
    const data = await response.json();

    if (response.ok && data.audioBase64) {
      const audioBlob = makePlayableAudioBlob(data.audioBase64, data.mimeType);
      const audioUrl = URL.createObjectURL(audioBlob);
      const audio = new Audio(audioUrl);
      currentAudio = audio;

      audio.onended = () => {
        URL.revokeObjectURL(audioUrl);
        if (currentAudio === audio) currentAudio = null;
        info.textContent = "AARO AI සම්බන්ධයි. තව ප්‍රශ්නයක් අහන්න.";
      };
      audio.onerror = () => {
        URL.revokeObjectURL(audioUrl);
        if (currentAudio === audio) currentAudio = null;
        info.textContent = "හඬ ගොනුව play කරන්න බැරි වුණා. Browser හඬෙන් උත්සාහ කරනවා...";
        speak(spokenText);
      };

      try {
        await audio.play();
        info.textContent = "AARO AI හඬින් පිළිතුරු දෙනවා...";
        return;
      } catch (playError) {
        URL.revokeObjectURL(audioUrl);
        if (currentAudio === audio) currentAudio = null;
        console.warn("Generated audio playback blocked:", playError);
      }
    } else {
      console.warn("AARO TTS route failed:", response.status, data);
      info.textContent = "AI හඬ සේවාව තාවකාලිකව ලබාගත නොහැක (" +
        (data.status || response.status) + "). Browser හඬෙන් උත්සාහ කරනවා...";
    }
  } catch (error) {
    console.warn("AARO TTS request failed:", error);
    info.textContent = "AI හඬ සේවාවට සම්බන්ධ විය නොහැක. Browser හඬෙන් උත්සාහ කරනවා...";
  }

  speak(spokenText);
}

async function reply(text, responseMode = "text") {
  if (isReplying) {
    if (responseMode === "text") {
      addMessage("පෙර පණිවිඩයට පිළිතුරු සකස් කරමින් ඉන්නවා. මොහොතක් ඉන්න.", "bot");
    } else {
      info.textContent = "පෙර පිළිතුර සකස් කරමින් ඉන්නවා. මොහොතක් ඉන්න.";
    }
    return;
  }

  isReplying = true;
  info.textContent = "AARO AI පිළිතුර සකස් කරමින්...";
  try {
    const response = await fetch(AARO_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: language.value.toLowerCase().startsWith("si")
          ? (
              responseMode === "voice"
                ? "අනිවාර්ය උපදෙස්: පිළිතුර සිංහල අකුරුවලින්, ස්වාභාවික සහ පැහැදිලි සිංහලෙන් පමණක් දෙන්න. ඉංග්‍රීසි වාක්‍ය, ඉංග්‍රීසි හැඳින්වීමක් හෝ කෙටි generic පිළිතුරක් දෙන්න එපා. ප්‍රශ්නයට සෘජුව පිළිතුරු දී අවශ්‍ය විස්තර සිංහලෙන් පැහැදිලි කරන්න. පරිශීලකයාගේ හඳුනාගත් කථාව: " + text
                : "අනිවාර්ය උපදෙස්: පිළිතුර සිංහල අකුරුවලින්, ස්වාභාවික සහ පැහැදිලි සිංහලෙන් පමණක් දෙන්න. ඉංග්‍රීසි වාක්‍ය හෝ ඉංග්‍රීසි හැඳින්වීමක් දෙන්න එපා. ප්‍රශ්නයට සෘජුව පිළිතුරු දී අවශ්‍ය විස්තර සිංහලෙන් පැහැදිලි කරන්න. පරිශීලකයාගේ පණිවිඩය: " + text
            )
          : text,
        history: (responseMode === "voice" ? voiceConversationHistory : conversationHistory).slice(-10)
      })
    });

    let data;
    try {
      data = await response.json();
    } catch (_) {
      throw new Error("Server එකෙන් කියවිය හැකි පිළිතුරක් ලැබුණේ නැහැ.");
    }

    if (!response.ok || !data.reply) {
      throw new Error((data.error || "AI සේවාවෙන් පිළිතුරක් ලැබුණේ නැහැ.") + (data.status ? " (HTTP " + data.status + ")" : ""));
    }

    const answer = String(data.reply).trim();
    if (responseMode === "voice") {
      // Voice conversations are separate and are not saved into visible Chat Mode history.
      voiceConversationHistory.push({ role: "user", text: text });
      voiceConversationHistory.push({ role: "model", text: answer });
      voiceConversationHistory = voiceConversationHistory.slice(-MAX_SAVED_MESSAGES);
      info.textContent = "පිළිතුර ලැබුණා. හඬ සකස් කරමින්...";
      await speakAnswer(answer);
    } else {
      // Only typed Chat Mode conversations are displayed and saved as text.
      conversationHistory.push({ role: "user", text: text });
      conversationHistory.push({ role: "model", text: answer });
      conversationHistory = conversationHistory.slice(-MAX_SAVED_MESSAGES);
      saveConversationMemory();
      addMessage(answer, "bot");
      info.textContent = "AARO AI සම්බන්ධයි. තව ප්‍රශ්නයක් අහන්න.";
    }
  } catch (error) {
    console.error("AARO AI request failed:", error);
    addMessage(
      "AARO AI වෙත සම්බන්ධ වෙන්න බැරි වුණා. Internet connection එක සහ Cloudflare Worker settings පරීක්ෂා කර නැවත උත්සාහ කරන්න. (" + (error.message || "Network error") + ")",
      "bot"
    );
    info.textContent = "AI සම්බන්ධතාවයේ දෝෂයක්. නැවත උත්සාහ කරන්න.";
  } finally {
    isReplying = false;
  }
}

form.addEventListener("submit", (event) => {
  event.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  if (listening && recognition) {
    recognition.stop();
  }

  addMessage(text, "user");
  input.value = "";
  reply(text, "text");
});

let keepListening = false;
let speechFinalText = "";

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    info.textContent =
      "මෙම browser එක voice recognition සඳහා සහාය නොදක්වයි. " +
      "PC එකේ අලුත් Chrome හෝ Edge version එකකින් පරීක්ෂා කරන්න.";
    return;
  }

  // Mic button එක නැවත ඔබන විට කතාව අවසන් කර ප්‍රතිඵලය යවයි.
  if (listening && recognition) {
    keepListening = false;
    info.textContent = "කතාව අවසන් කරමින්...";
    try {
      recognition.stop();
    } catch (error) {
      finishVoiceSession();
    }
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = language.value;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.maxAlternatives = 3;

  speechFinalText = "";
  input.value = "";
  keepListening = true;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add("listening");
    micBtn.textContent = "✅ අවසන් කරන්න / යවන්න";
    info.textContent =
      "දැන් කතා කරන්න. අවසන් වූ විට mic බොත්තම නැවත ඔබන්න.";
  };

  recognition.onresult = (event) => {
    const finalParts = [];
    const interimParts = [];

    // සම්පූර්ණ results ලැයිස්තුව නැවත කියවීමෙන්
    // final වචන නැවත නැවත එකතු වීම අඩු කරයි.
    for (let i = 0; i < event.results.length; i++) {
      const result = event.results[i];
      const best = result[0];

      if (!best || !best.transcript) continue;

      if (result.isFinal) {
        finalParts.push(best.transcript.trim());
      } else {
        interimParts.push(best.transcript.trim());
      }
    }

    speechFinalText = finalParts.filter(Boolean).join(" ").trim();
    const interimText = interimParts.filter(Boolean).join(" ").trim();
    input.value = [speechFinalText, interimText].filter(Boolean).join(" ").trim();

    if (input.value) {
      info.textContent = "හඳුනාගත් වචන පෙන්වනවා. කතාව අවසන් වූ විට mic බොත්තම ඔබන්න.";
    }
  };

  recognition.onerror = (event) => {
    // සමහර browser වල නිහඬ විරාමයකදී no-speech එන්න පුළුවන්.
    // එවැනි අවස්ථාවක නැවත අහන්න උත්සාහ කරයි.
    if (event.error === "no-speech") {
      return;
    }

    keepListening = false;
    info.textContent =
      "Voice error: " + event.error +
      ". Microphone අවසරය, අන්තර්ජාලය සහ තෝරාගත් භාෂාව පරීක්ෂා කරන්න.";
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎙️ කතා කරන්න";

    if (keepListening) {
      // Browser එක recognition session එක ස්වයංක්‍රීයව අවසන් කළොත්
      // අලුත් session එකක් අරඹා එම කතාව දිගටම එකතු කරයි.
      info.textContent = "තொடர்ந்து கேட்கிறேன்… தொடர்ந்து பேசுங்கள்.";
      setTimeout(() => {
        if (!keepListening || !recognition) return;
        try {
          recognition.start();
        } catch (error) {
          info.textContent =
            "Voice නැවත ආරම්භ කරන්න බැරි වුණා. Mic බොත්තම නැවත ඔබන්න.";
          keepListening = false;
        }
      }, 300);
      return;
    }

    finishVoiceSession();
  };

  try {
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    recognition.start();
  } catch (error) {
    keepListening = false;
    listening = false;
    micBtn.classList.remove("listening");
    micBtn.textContent = "🎙️ කතා කරන්න";
    info.textContent =
      "Voice ආරම්භ කරන්න බැරි වුණා. තත්පර කිහිපයකින් නැවත උත්සාහ කරන්න.";
  }
}

function finishVoiceSession() {
  const text = (speechFinalText || input.value).trim();
  listening = false;
  keepListening = false;
  micBtn.classList.remove("listening");
  micBtn.textContent = "🎙️ කතා කරන්න";

  if (text) {
    input.value = "";
    // Voice mode sends recognized speech internally only; no text transcript is shown.
    info.textContent = "හඬ හඳුනාගත්තා. AARO හඬින් පිළිතුරු දෙමින්...";
    reply(text, "voice");
  } else {
    input.value = "";
    info.textContent =
      "කතාව හඳුනාගන්න බැරි වුණා. Mic අවසරය සහ භාෂාව පරීක්ෂා කර නැවත උත්සාහ කරන්න.";
  }
}
micBtn.addEventListener("click", startListening);

testVoiceBtn.addEventListener("click", () => {
  // Diagnostic test: bypass the Worker TTS API and test browser speech directly.
  const testText = language.value.toLowerCase().startsWith("si")
    ? "ආයුබෝවන්. මම ආරෝ කෘත්‍රිම බුද්ධි සහායකයා. හඬ පරීක්ෂාව සාර්ථකයි."
    : "Hello. I am AARO AI. This is a voice test.";

  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();

  info.textContent = "Browser හඬ පරීක්ෂා කරමින්...";
  speak(testText);
});

clearMemoryBtn.addEventListener("click", () => {
  const confirmed = window.confirm(
    "මේ device එකේ save කරපු AARO AI chat memory එක මකන්නද? මේ ක්‍රියාව ආපසු හැරවිය නොහැක."
  );
  if (!confirmed) return;

  conversationHistory = [];
  try {
    localStorage.removeItem(MEMORY_KEY);
  } catch (error) {
    // Clear the visible chat even if browser storage is unavailable.
  }
  showWelcomeMessage();
  info.textContent = "Chat memory මේ device එකෙන් මකා දැම්මා.";
});

stopBtn.addEventListener("click", () => {
  speechRequestId++;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio.currentTime = 0;
    currentAudio = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();

  if (recognition && listening) {
    keepListening = false;
    info.textContent = "කතාව අවසන් කරමින්...";
    try {
      recognition.stop();
    } catch (error) {
      finishVoiceSession();
    }
  } else {
    info.textContent = "හඬ නවත්වන ලදී.";
  }
});

language.addEventListener("change", () => {
  info.textContent = "Voice language: " + language.options[
    language.selectedIndex
  ].textContent;
});

// Initialize in Chat Mode so the microphone cannot run in text-only mode.
setMode("chat");

// Restore the saved conversation when this page opens.
showWelcomeMessage();

</script>
